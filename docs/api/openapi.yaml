openapi: 3.1.0
info:
  title: WAI Bridge Local API
  version: 0.1.0
  description: Local REST API. Production binds only to 127.0.0.1. All /api routes require the configured local bearer token.
servers:
  - url: http://127.0.0.1:47831
security:
  - LocalBearer: []
paths:
  /api/contact-catalog:
    post:
      summary: Create confirmed local catalog entry
      description: ContactCreateSchema; 201 ContactCatalogSchema. User-asserted phone never grants send proof.
      responses:
        '201': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
  /api/contact-catalog/{id}:
    get:
      summary: Read editable catalog fields and version
      description: ContactCatalogSchema; observed contacts start at version zero.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
    patch:
      summary: Update local fields using ContactUpdateSchema and expectedVersion
      responses:
        '200': { description: ContactCatalogSchema with incremented version }
        '409': { description: CONTACT_VERSION_CONFLICT or IDEMPOTENCY_CONFLICT }
  /api/reference-candidates:
    get:
      summary: List possible duplicate references for explicit review
      description: CandidateQuerySchema to ReferenceCandidatePageSchema; no history merge.
      responses:
        '200': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
  /api/reference-candidates/decisions:
    post:
      summary: Confirm LINK or DISMISS decision
      description: CandidateDecisionSchema; same-account compatible linking only; historiesMerged false.
      responses:
        '200': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
  /api/conversation-policies/{id}:
    get:
      summary: Read conversation policy
      description: ConversationPolicySchema.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
    post:
      summary: Save explicitly confirmed PolicyUpdateSchema without starting a batch
      responses:
        '200': { description: ConversationPolicySchema }
  /api/operations:
    get:
      summary: Read local bounded operational summary
      description: OperationSummarySchema plus runtime status; never starts navigation.
      responses:
        '200': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
  /api/dialogue-sync-batches/{id}/report:
    get:
      summary: Read paginated batch outcomes and remaining pending count
      description: DialogueSyncBatchReportSchema; synchronization is not human reading confirmation.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
  /api/dialogue-sync-batches/{id}/retry-failed:
    post:
      summary: Explicitly create a new batch of failed items only
      description: RetryBatchFailuresSchema; terminal source batch required; 202 status; idempotent.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
  /api/maintenance:
    get:
      summary: Read maintenance policy and backup runs
      description: MaintenanceStatusSchema; last twenty runs.
      responses:
        '200': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
    post:
      summary: Save MaintenanceUpdateSchema with separate deletion authorization for pruning
      responses:
        '200': { description: MaintenanceStatusSchema }
        '400':
          { description: Missing explicitConfirmation or authorizeDeletion for enabled pruning }
  /api/maintenance/backup:
    post:
      summary: Create and verify local consistent backup
      description: explicitConfirmation true required; BackupResultSchema; fixed server path, restore clone validation.
      responses:
        '200': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
  /api/extension-telemetry/{id}:
    post:
      summary: Record extension diagnostics without message content
      description: ExtensionTelemetrySchema; bounded capture metrics and optional UI compatibility.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Successful validated operation }
        '400': { description: Invalid contract or missing literal confirmation }
        '401': { description: Local bearer token required }
        '409': { description: Version, identity, idempotency or operation state conflict }
  /api/contacts/directory:
    get:
      summary: Read only registered SQLite contacts with combined name and local registration-date filters
      description: ContactDirectoryQuerySchema to ContactDirectoryPageSchema. No UI access, inferred relationships or silent deduplication. Explicitly registered relationships are searchable in the catalog overlay. Missing nickname/fullName/phone remain null. Follow nextCursor until null for all rows. Legacy contacts endpoints are preserved.
      parameters:
        - { in: query, name: accountId, schema: { type: string, format: uuid } }
        - { in: query, name: query, schema: { type: string, minLength: 1, maxLength: 256 } }
        - {
            in: query,
            name: match,
            schema: { type: string, enum: [EXACT, STARTS_WITH, CONTAINS], default: CONTAINS },
          }
        - { in: query, name: registeredPeriod, schema: { type: string, enum: [TODAY, YESTERDAY] } }
        - { in: query, name: registeredOn, schema: { type: string, format: date } }
        - { in: query, name: registeredFrom, schema: { type: string, format: date } }
        - { in: query, name: registeredTo, schema: { type: string, format: date } }
        - { in: query, name: timeZone, schema: { type: string, default: America/Sao_Paulo } }
        - { in: query, name: cursor, schema: { type: string, format: uuid } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
      responses:
        '200':
          {
            description: 'ContactDirectoryPageSchema; items(id,accountScope,name,nickname,fullName,phone,registeredAt), total, nextCursor, source SQLITE_ONLY, timeZone and UTC boundaries',
          }
        '400': { description: Invalid or conflicting calendar/date/zone/search/page contract }
        '401': { description: Authentication required }
  /api/dialogue-sync-batches:
    post:
      summary: Persist an explicitly authorized sequential pending-conversation batch
      description: DialogueSyncBatchRequestSchema. ALL_PENDING fixes the current list; SELECTED preserves a unique UUID array. At most5000, one RUNNING globally, one child job at a time, up to50 rendered messages per chat,24h global TTL. Never scrolls, sends or automatically confirms read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scope, explicitAuthorization, idempotencyKey]
              properties:
                scope: { type: string, enum: [ALL_PENDING, SELECTED] }
                conversationIds:
                  {
                    type: array,
                    minItems: 1,
                    maxItems: 5000,
                    uniqueItems: true,
                    items: { type: string, format: uuid },
                  }
                accountId: { type: string, format: uuid }
                explicitAuthorization: { type: boolean, const: true }
                idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
                limitPerConversation: { type: integer, minimum: 1, maximum: 50, default: 50 }
      responses:
        '202':
          {
            description: DialogueSyncBatchStatusSchema including ID,
            status,
            counts,
            currentPosition and partial coverage,
          }
        '400': { description: Invalid contract or missing explicit authorization }
        '404': { description: Selected reference not found }
        '409':
          {
            description: Busy,
            ambiguous account,
            account mismatch,
            too large or idempotency conflict,
          }
  /api/dialogue-sync-batches/{id}:
    get:
      summary: Read persisted batch progress and item results without scheduling navigation
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: cursor, schema: { type: integer, minimum: 0, maximum: 4999 } }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 20 },
          }
      responses:
        '200':
          {
            description: 'DialogueSyncBatchPageSchema; batch, items(position,conversationId,query,status,syncRequestId,attempts,code), nextCursor',
          }
        '404': { description: Batch not found }
  /api/dialogue-sync-batches/{id}/cancel:
    post:
      summary: Cancel remaining work and signal active reader without deleting committed snapshots
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [explicitAuthorization]
              properties:
                explicitAuthorization: { type: boolean, const: true }
      responses:
        '200':
          {
            description: DialogueSyncBatchStatusSchema; idempotent cancellation,
            successes preserved,
          }
        '404': { description: Batch not found }
  /api/dialogue-sync-batches/{id}/resume:
    post:
      summary: Explicitly resume paused work with a new run token and no repetition of successes
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [explicitAuthorization]
              properties:
                explicitAuthorization: { type: boolean, const: true }
                retryFailedItem: { type: boolean, default: false }
      responses:
        '200':
          {
            description: DialogueSyncBatchStatusSchema; retry only explicitly selected failed item,
            never successes,
          }
        '409': { description: Not paused, terminal or another batch running }
  /api/conversation-reviews:
    get:
      summary: List persistent review queue without navigation or read confirmation
      description: ConversationReviewQuerySchema to ConversationReviewPageSchema. Observed UI signals are not message counts; coverage remains partial. Follow nextCursor for all items.
      parameters:
        - { in: query, name: accountId, schema: { type: string, format: uuid } }
        - { in: query, name: query, schema: { type: string, minLength: 1, maxLength: 100 } }
        - {
            in: query,
            name: pendingOnly,
            schema: { type: string, enum: ['true', 'false'], default: 'true' },
          }
        - {
            in: query,
            name: stage,
            schema:
              {
                type: string,
                enum:
                  [
                    WAITING_SYNC,
                    SYNC_REQUESTED,
                    SYNCING,
                    SYNC_FAILED,
                    SYNC_EXPIRED,
                    SYNCED_PARTIAL,
                    READ_CONFIRMED,
                  ],
              },
          }
        - {
            in: query,
            name: limit,
            schema: { type: integer, minimum: 1, maximum: 100, default: 50 },
          }
        - { in: query, name: cursor, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            description: 'ConversationReviewPageSchema with items, total, nextCursor, scope OBSERVED_UI_ONLY and complete=false',
          }
        '400': { description: Invalid strict query contract }
        '401': { description: Authentication required }
  /api/conversation-reviews/{id}:
    get:
      summary: Get current persisted review stage and revisions without navigating
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          {
            description: ConversationReviewItemSchema including stage,
            revisions,
            unread observation,
            last sync/error and related references,
          }
        '404': { description: Unknown review }
  /api/conversation-reviews/{id}/ack:
    post:
      summary: Explicitly acknowledge the latest verified partial snapshot revision
      description: Requires last successful syncRequestId and current verified revision with no newer signal. Idempotent; never updates per-message AI READ or WhatsApp read indicator.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [syncRequestId, revision, explicitConfirmation]
              properties:
                syncRequestId: { type: string, format: uuid }
                revision: { type: integer, minimum: 1 }
                explicitConfirmation: { type: boolean, const: true }
      responses:
        '200': { description: ConversationReviewItemSchema with READ_CONFIRMED }
        '400': { description: Invalid contract or missing explicit confirmation }
        '404': { description: Unknown review }
        '409': { description: REVIEW_STALE_CONFIRMATION }
  /api/conversation-reviews/{id}/links:
    post:
      summary: Explicitly associate compatible same-account references without merging histories
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [relatedConversationId, explicitConfirmation]
              properties:
                relatedConversationId: { type: string, format: uuid }
                explicitConfirmation: { type: boolean, const: true }
      responses:
        '200':
          {
            description: 'conversationId, relatedConversationId, linked=true, historiesMerged=false',
          }
        '400': { description: Invalid contract or missing explicit confirmation }
        '404': { description: Unknown reference }
        '409': { description: REVIEW_IDENTITY_CONFLICT }
  /api/dialogue-sync:
    post:
      summary: Persist a bounded visible dialogue reconciliation request
      description: DialogueSyncRequestSchema; query, optional accountId and conversationId (bind selected pending reference), limit 1..50 (default50), idempotencyKey. TTL30s; monitor ON and one compatible tab required for execution. Never sends or scrolls history.
      responses:
        '202':
          description: DialogueSyncResultSchema; state, conversationId, ordered messageIds, counts, code, timestamps, truncated, scope VISIBLE_RENDERED_ONLY, complete=false
        '409':
          description: Idempotency conflict or queue full
  /api/dialogue-sync/{id}:
    get:
      summary: Read persisted synchronization status
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: DialogueSyncResultSchema; pending/failed does not imply freshness
        '404':
          description: Unknown synchronization request
  /api/dialogue-sync/{id}/messages:
    get:
      summary: Read committed snapshot messages in rendered UI order
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Persisted message items in snapshot order; nextCursor=null
        '409':
          description: Sync not successful or messages unavailable
  /api/extension/dialogue-sync/poll:
    post:
      summary: Native host preflights or claims one requested dialogue check
      description: DialogueSyncPollSchema; extensionInstanceId, ready, optional accountId. Claim requires ready/accountId and unoccupied UI; no send permission required. Optional activeRequestId plus leaseToken checks cancellation of an exact instance/account/lease; result can contain cancelRequestId. Batch jobs carry a validated UUID array, position, total and runToken.
      responses:
        '200':
          description: DialogueSyncPollResultSchema; pending and job/null
  /api/extension/dialogue-sync/complete:
    post:
      summary: Atomically persist validated rendered observations and sync result
      description: DialogueSyncCompletionSchema; instance, requestId, leaseToken, code, identity and conversationLabel on OK, observations max50, truncated. HTTP limit4MiB. Account/context mismatch reverts snapshot; completed replay is idempotent.
      responses:
        '200':
          description: Committed DialogueSyncResultSchema; SUCCEEDED or FAILED
        '409':
          description: Lease, account, target, revision or context conflict
  /api/conversations/{id}/capture-coverage:
    get:
      summary: Observed UI coverage and bounded recent activity signals
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: CaptureCoverageSchema; complete=false, counts, recentActivity (max20), unavailable text/media and timestamps. Activity signals are not messages.
        '404':
          description: Unknown conversation
  /api/diagnostics/logs:
    get:
      summary: Query bounded correlated operational logs (FlowLogQuerySchema)
      description: Optional traceId/resourceId UUID, component, level, beforeSequence and limit (1–100, default50). See docs/operations/flow-logging.md.
      responses:
        '200':
          description: items, nextBeforeSequence, latestRecorded, commandStatus, resolvedTraceId, coverage and retention
    post:
      summary: Append diagnostic events (FlowLogBatchSchema)
      description: Strict shared contract with 1–50 events, UUID correlation, enumerated component/phase/code; no message text, names, phone numbers or secrets. Duplicate IDs are accepted without reinsertion.
      responses:
        '202':
          description: accepted and inserted counts
  /health:
    get:
      security: []
      responses:
        '200':
          description: Process health, no personal data
  /api/status:
    get:
      responses:
        '200':
          description: API/database status
  /api/extension/state:
    post:
      summary: Record Native Messaging extension connectivity
      security: [{ LocalBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [extensionInstanceId, status, lastSeenAt]
              properties:
                extensionInstanceId: { type: string, format: uuid }
                status: { type: string, enum: [CONNECTED, DISCONNECTED] }
                lastSeenAt: { type: string, format: date-time }
      responses:
        '204': { description: State persisted }
        '400': { description: Invalid state payload }
        '401': { description: Unauthorized }
  /api/observations:
    post:
      summary: Persist one incremental UI observation, normalization and events atomically
      description: >-
        Known-direction MESSAGE observations become queryable messages with UNKNOWN identity
        and sourceObservationId. Labels never merge identities; each observation has its own
        internal conversation. Unknown direction stays staged. Activity creates no message.
        The original observation event and optional message aggregate event contain no text.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaptureSubmission' }
      responses:
        '202':
          description: Observation persisted; duplicate returns the original event ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/observations/{id}:
    get:
      summary: Retrieve a persisted observation without changing AI read state
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200':
          description: Full observation; may contain sensitive message text
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureObservation' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/contacts:
    get:
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses:
        {
          '200': { description: Cursor-paginated contacts },
          '400': { $ref: '#/components/responses/Error' },
        }
  /api/contacts/search:
    get:
      parameters:
        - {
            name: q,
            in: query,
            required: true,
            schema: { type: string, minLength: 2, maxLength: 100 },
          }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        {
          '200': { description: Matching contacts },
          '400': { $ref: '#/components/responses/Error' },
        }
  /api/conversations:
    get:
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - in: query
          name: q
          schema: { type: string, minLength: 2, maxLength: 100 }
          description: Optional literal title substring; does not merge identities.
      responses: { '200': { description: Cursor-paginated conversations } }
  /api/conversations/{id}:
    get:
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        { '200': { description: Conversation }, '404': { $ref: '#/components/responses/Error' } }
  /api/conversations/{id}/messages:
    get:
      parameters:
        [
          { $ref: '#/components/parameters/Id' },
          { $ref: '#/components/parameters/Cursor' },
          { $ref: '#/components/parameters/Limit' },
        ]
      responses: { '200': { description: Conversation messages; does not change AI read state } }
  /api/messages:
    get:
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
        - { name: conversationId, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: aiState, in: query, schema: { $ref: '#/components/schemas/AIMessageState' } }
        - { name: consumerId, in: query, schema: { type: string, minLength: 1, maxLength: 128 } }
        - { name: direction, in: query, schema: { $ref: '#/components/schemas/Direction' } }
        - { name: captureStatus, in: query, schema: { $ref: '#/components/schemas/CaptureStatus' } }
      responses: { '200': { description: Filtered recent messages; read-only } }
  /api/messages/unread:
    get:
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: AI UNREAD messages } }
  /api/messages/recent:
    get:
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Newest messages regardless of AI read status } }
  /api/media/{id}:
    get:
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        {
          '200': { description: Authorized media metadata; local storage path is never returned },
          '404': { $ref: '#/components/responses/Error' },
        }
  /api/events:
    get:
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Persisted event feed } }
  /api/events/pending:
    get:
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Events with pending broadcast delivery } }
  /api/ai/claims:
    post:
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [messageId, consumerId],
                properties:
                  {
                    messageId: { $ref: '#/components/schemas/Id' },
                    consumerId: { type: string, minLength: 1, maxLength: 128 },
                  },
              }
      responses:
        {
          '200': { description: Idempotent claim with claimToken },
          '400': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
        }
  /api/ai/ack:
    post:
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [messageId, consumerId, claimToken],
                properties:
                  {
                    messageId: { $ref: '#/components/schemas/Id' },
                    consumerId: { type: string },
                    claimToken: { $ref: '#/components/schemas/Id' },
                  },
              }
      responses:
        {
          '200': { description: Explicit ACK marks AI state READ },
          '409': { $ref: '#/components/responses/Error' },
        }
  /api/ai/consumer-claims:
    post:
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [messageId, consumerId],
                properties:
                  {
                    messageId: { $ref: '#/components/schemas/Id' },
                    consumerId: { type: string, minLength: 1, maxLength: 128 },
                    leaseMs: { type: integer, minimum: 1000, maximum: 86400000, default: 60000 },
                  },
              }
      responses:
        {
          '200':
            { description: Consumer-specific lease, claim token, and persistent attempt count },
          '409': { $ref: '#/components/responses/Error' },
        }
  /api/ai/consumer-ack:
    post:
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [messageId, consumerId, claimToken],
                properties:
                  {
                    messageId: { $ref: '#/components/schemas/Id' },
                    consumerId: { type: string, minLength: 1, maxLength: 128 },
                    claimToken: { $ref: '#/components/schemas/Id' },
                  },
              }
      responses:
        {
          '200': { description: Explicit ACK marks this consumer state READ },
          '409': { $ref: '#/components/responses/Error' },
        }
  /api/ai/consumer-fail:
    post:
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [messageId, consumerId, claimToken, errorCode],
                properties:
                  {
                    messageId: { $ref: '#/components/schemas/Id' },
                    consumerId: { type: string, minLength: 1, maxLength: 128 },
                    claimToken: { $ref: '#/components/schemas/Id' },
                    errorCode: { type: string, pattern: '^[A-Z0-9_]{1,64}$' },
                  },
              }
      responses:
        {
          '200': { description: Failure is recorded and eligible for reprocessing },
          '409': { $ref: '#/components/responses/Error' },
        }
  /api/ai/consumers/{consumerId}/recoverable:
    get:
      parameters:
        [
          {
            name: consumerId,
            in: path,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 128 },
          },
          { $ref: '#/components/parameters/Limit' },
        ]
      responses:
        {
          '200':
            {
              description: Unprocessed,
              failed,
              or expired-lease messages ordered by observedAt and id,
            },
        }
  /api/ai/messages/{messageId}/state:
    get:
      parameters:
        [
          {
            name: messageId,
            in: path,
            required: true,
            schema: { $ref: '#/components/schemas/Id' },
          },
          {
            name: consumerId,
            in: query,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 128 },
          },
        ]
      responses: { '200': { description: Consumer-specific read state; GET is read-only } }
  /api/outbox:
    get:
      parameters:
        [{ $ref: '#/components/parameters/Cursor' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { description: Cursor-paginated commands } }
    post:
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutboxRequest' }
      responses:
        {
          '202':
            { description: Command persisted as REQUESTED; no send is executed by this API route },
          '400': { $ref: '#/components/responses/Error' },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
        }
  /api/outbox/{id}:
    get:
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        {
          '200': { description: Command with status history },
          '404': { $ref: '#/components/responses/Error' },
        }
  /api/outbox/{id}/cancel:
    post:
      parameters:
        [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        {
          '200': { description: Command cancelled if no send has started },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
        }
  /api/outbox/{id}/result:
    post:
      parameters:
        [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                type: object,
                required: [result],
                properties:
                  {
                    result: { type: string, enum: [SENT, UNKNOWN, FAILED] },
                    evidenceRef: { type: string, minLength: 1, maxLength: 512 },
                  },
                allOf:
                  [
                    {
                      if: { properties: { result: { const: SENT } } },
                      then: { required: [evidenceRef] },
                    },
                  ],
              }
      responses:
        {
          '200': { description: Manual outcome recorded from verified evidence },
          '404': { $ref: '#/components/responses/Error' },
          '409': { $ref: '#/components/responses/Error' },
        }
  /api/extension/outbox:
    post:
      summary: Persist an authorized extension send with optional verified phone search
      parameters:
        - in: header
          name: idempotency-key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtensionSendRequest' }
      responses:
        '202': { description: Intent persisted; not a send confirmation }
        '409': { description: Unknown conversation or conflicting idempotency }
  /api/extension/outbox/phone:
    post:
      summary: Persist a send intent directly by international phone number
      parameters:
        - in: header
          name: idempotency-key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phoneNumber, text, explicitAuthorization]
              properties:
                phoneNumber:
                  {
                    type: string,
                    minLength: 9,
                    maxLength: 40,
                    description: Full international phone with +DDI; formatting is normalized.,
                  }
                accountId:
                  {
                    type: string,
                    format: uuid,
                    description: Optional only when exactly one recently active opted-in account exists.,
                  }
                text: { type: string, minLength: 1, maxLength: 10000 }
                mode: { type: string, enum: [AUTO, SUPERVISED], default: SUPERVISED }
                explicitAuthorization: { type: boolean, const: true }
      responses:
        '202': { description: Intent persisted or idempotently replayed; not delivery confirmation }
        '409': { description: No fresh sending account, ambiguous account, or idempotency conflict }
  /api/extension/outbox/recipient:
    post:
      summary: Resolve a stored recipient name to a unique phone and persist a send intent
      parameters:
        - in: header
          name: idempotency-key
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipientName, text, explicitAuthorization]
              properties:
                recipientName: { type: string, minLength: 2, maxLength: 256 }
                accountId: { type: string, format: uuid }
                text: { type: string, minLength: 1, maxLength: 10000 }
                mode: { type: string, enum: [AUTO, SUPERVISED], default: SUPERVISED }
                explicitAuthorization: { type: boolean, const: true }
      responses:
        '202': { description: Intent persisted or replayed; not delivery confirmation }
        '409':
          {
            description: Missing or ambiguous account,
            name or phone,
            search too broad,
            or idempotency conflict,
          }
  /api/extension/outbox/poll:
    post:
      summary: Native host claims one command for the current confirmed identity
      description: Body follows ExtensionSendPollSchema in packages/shared/src/extension-send.ts. Requires extensionInstanceId; identity is optional only for diagnostics. Without identity no claim is possible. ready=false preflights without claim and may return pending=true. visible records observed readiness. Optional reason, protocolVersion=2 and clientBuild expose health. Optional activeCommand (id/contextId/leaseToken) authenticates supervision and returns activeStatus without another claim. With locateByPhone in the stored request, may claim a direct-contact command from another open context in the same local account; the extension must verify the visible profile phone. Response is null command or a leased command; never log lease tokens.
      responses:
        '200': { description: Validated ExtensionSendPollResultSchema }
  /api/extension/outbox/progress:
    post:
      summary: Acknowledge durable progress before the extension send effect
      description: Body follows ExtensionSendProgressSchema. Requires extension instance, context, command, lease token, step and code. SENT requires a visible-outbound SHA-256 evidence reference. SENDING requires completed countdown in AUTO. Phone-search WAITING_USER/WAITING_AUTO_SEND requires resolvedIdentity and conversationLabel matching the account and phone; persists observed contact and outbox conversation atomically.
      responses:
        '200': { description: Progress committed }
        '409': { description: Invalid lease, context or transition }
  /api/extension/outbox/{id}/cancel:
    post:
      summary: Cancel an extension send before SENDING
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Cancelled or already cancelled }
        '409': { description: Execution already started or terminal }
components:
  securitySchemes:
    LocalBearer: { type: http, scheme: bearer }
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 256 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
  schemas:
    ExtensionSendRequest:
      type: object
      additionalProperties: false
      required: [conversationId, text, explicitAuthorization]
      properties:
        conversationId: { type: string, format: uuid }
        text: { type: string, minLength: 1, maxLength: 10000 }
        mode: { type: string, enum: [AUTO, SUPERVISED], default: SUPERVISED }
        explicitAuthorization: { type: boolean, enum: [true] }
        locateByPhone:
          {
            type: boolean,
            default: false,
            description: Search by stored direct-contact phone and verify the opened visible profile before composing.,
          }
    Id: { type: string, format: uuid }
    CaptureObservation:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          observationId,
          observedAt,
          observationType,
          captureState,
          conversation,
          senderLabel,
          direction,
          content,
          contentAvailability,
          media,
        ]
      properties:
        kind: { type: string, const: CAPTURE_OBSERVATION }
        observationId: { $ref: '#/components/schemas/Id' }
        observedAt: { type: string, format: date-time, description: UTC timestamp ending in Z }
        observationType: { type: string, enum: [MESSAGE, CONVERSATION_ACTIVITY] }
        captureState: { $ref: '#/components/schemas/CaptureStatus' }
        conversation:
          type: object
          additionalProperties: false
          required: [label, kind]
          properties:
            label: { type: [string, 'null'], maxLength: 256 }
            kind: { type: string, enum: [INDIVIDUAL, GROUP, UNKNOWN] }
        senderLabel: { type: [string, 'null'], maxLength: 256 }
        direction: { type: string, enum: [INBOUND, OUTBOUND, UNKNOWN] }
        content: { type: [string, 'null'], maxLength: 10000 }
        contentAvailability: { type: string, enum: [AVAILABLE, UNAVAILABLE] }
        media:
          type: array
          maxItems: 16
          items: { type: string, enum: [IMAGE, AUDIO, VIDEO, DOCUMENT, UNKNOWN] }
        activity:
          type: object
          additionalProperties: false
          required: [unreadCount, reason]
          properties:
            unreadCount: { type: [integer, 'null'], minimum: 0 }
            reason: { type: string, enum: [INITIAL_UNREAD, ROW_CHANGED, UNREAD_DECREASED] }
        identity: { $ref: '#/components/schemas/ConversationIdentity' }
        messageRef:
          type: object
          additionalProperties: false
          required: [key, revision, firstObservedAt]
          description: Optional local reference for MESSAGE only; firstObservedAt must not be after observedAt.
          properties:
            key: { type: string, format: uuid }
            revision: { type: integer, minimum: 1, maximum: 1000000 }
            firstObservedAt: { type: string, format: date-time }
    ConversationIdentity:
      description: >-
        Experimental local reference, manually confirmed or automatically observed. Requires matching conversation kind (CONVERSATION_ACTIVITY accepts UI_CONTEXT only) and confirmedAt not later than observedAt.
        PHONE is an observed profile number; GROUP_LOCAL is a user-assigned UUID,
        not an official WhatsApp group ID. UI_CONTEXT uses an ephemeral local UUID and VISIBLE_UI evidence. confirmedAt then means observation time, not human confirmation. No source alone authorizes sending.
      oneOf:
        - type: object
          additionalProperties: false
          required: [version, accountId, contextId, confirmedAt, type, source, phone]
          properties:
            version: { type: integer, const: 1 }
            accountId: { $ref: '#/components/schemas/Id' }
            contextId: { $ref: '#/components/schemas/Id' }
            confirmedAt: { type: string, format: date-time }
            type: { type: string, const: PHONE }
            source: { type: string, const: PROFILE_PHONE }
            phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$' }
        - type: object
          additionalProperties: false
          required: [version, accountId, contextId, confirmedAt, type, source, groupId, groupLabel]
          properties:
            version: { type: integer, const: 1 }
            accountId: { $ref: '#/components/schemas/Id' }
            contextId: { $ref: '#/components/schemas/Id' }
            confirmedAt: { type: string, format: date-time }
            type: { type: string, const: GROUP_LOCAL }
            source: { type: string, const: USER_GROUP }
            groupId: { $ref: '#/components/schemas/Id' }
            groupLabel: { type: string, minLength: 1, maxLength: 256 }
        - type: object
          additionalProperties: false
          required:
            [
              version,
              accountId,
              contextId,
              confirmedAt,
              type,
              source,
              conversationKey,
              conversationKind,
            ]
          properties:
            version: { type: integer, const: 1 }
            accountId: { $ref: '#/components/schemas/Id' }
            contextId: { $ref: '#/components/schemas/Id' }
            confirmedAt: { type: string, format: date-time }
            type: { type: string, const: UI_CONTEXT }
            source: { type: string, const: VISIBLE_UI }
            conversationKey: { $ref: '#/components/schemas/Id' }
            conversationKind: { type: string, enum: [INDIVIDUAL, GROUP, UNKNOWN] }
            phone:
              {
                type: string,
                pattern: '^\+[1-9][0-9]{7,14}$',
                description: 'Optional visible profile phone; only permitted for INDIVIDUAL.',
              }
    CaptureSubmission:
      type: object
      additionalProperties: false
      required: [extensionInstanceId, observation]
      properties:
        extensionInstanceId: { $ref: '#/components/schemas/Id' }
        observation: { $ref: '#/components/schemas/CaptureObservation' }
    CaptureResult:
      type: object
      additionalProperties: false
      required: [observationId, eventId, duplicate]
      properties:
        observationId: { $ref: '#/components/schemas/Id' }
        eventId: { $ref: '#/components/schemas/Id' }
        duplicate: { type: boolean }
    Direction: { type: string, enum: [INBOUND, OUTBOUND] }
    CaptureStatus: { type: string, enum: [DETECTED, CAPTURED, PENDING, FAILED] }
    AIMessageState: { type: string, enum: [UNREAD, CLAIMED, READ, FAILED] }
    OutboxRequest:
      type: object
      additionalProperties: false
      required: [recipientId, text, explicitAuthorization]
      properties:
        recipientId: { $ref: '#/components/schemas/Id' }
        text: { type: string, minLength: 1, maxLength: 10000 }
        mode: { type: string, enum: [AUTO, SUPERVISED], default: SUPERVISED }
        explicitAuthorization: { type: boolean, const: true }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code: { type: string }
            message: { type: string }
            correlationId: { type: string }
  responses:
    Error:
      description: Structured API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
